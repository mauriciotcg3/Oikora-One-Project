# Noturno em dia útil, na `main` (OIK-ADR-0010 §7). Playwright + axe e a suíte de migração entram com a
# T-45; por enquanto roda a verificação completa de dependências.
name: Noturno

on:
  schedule:
    # 06:00 UTC = 03:00 em Brasília, de segunda a sexta.
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencias:
    name: Verificação de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: composer audit
        working-directory: api
        run: composer audit --locked
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - name: pnpm audit
        run: pnpm audit

  jornadas:
    name: Jornadas críticas (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Entra com a T-45 (OIK-SPEC-0001)."
